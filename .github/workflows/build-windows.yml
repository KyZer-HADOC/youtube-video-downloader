name: Build KyZer YouBe Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kyzer-yoube-windows-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Validate Python source
        run: |
          python -m compileall -q app.py downloader.py build_windows.py
          python -m unittest discover -s tests -v

      - name: Build size-optimised Windows application folder
        run: python build_windows.py

      - name: Report packaged folder size
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem "dist\KyZer YouBe" -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Packaged application: {0:N1} MiB" -f ($bytes / 1MB))

      - name: Sign app executable when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $certPath = Join-Path $env:RUNNER_TEMP "kyzer-codesign.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
            $kits = Join-Path $programFilesX86 "Windows Kits\10\bin"
            $signTool = Get-ChildItem -LiteralPath $kits -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw "Windows SDK signtool.exe was not found." }
            $appExe = Join-Path $PWD "dist\KyZer YouBe\KyZer YouBe.exe"
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $appExe
            if ($LASTEXITCODE -ne 0) { throw "Signing the app executable failed." }
            "Trusted Authenticode signature applied to app executable."
          } else {
            Write-Warning "No trusted signing certificate secrets found. App executable will be unsigned."
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer" | Out-Null
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $compiler = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found: $compiler" }
          & $compiler "Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setupBytes = (Get-Item "installer\KyZer-YouBe-Setup.exe").Length
          Write-Host ("Setup.exe: {0:N1} MiB" -f ($setupBytes / 1MB))

      - name: Sign Setup.exe when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $certPath = Join-Path $env:RUNNER_TEMP "kyzer-codesign.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
            $kits = Join-Path $programFilesX86 "Windows Kits\10\bin"
            $signTool = Get-ChildItem -LiteralPath $kits -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw "Windows SDK signtool.exe was not found." }
            $setupExe = Join-Path $PWD "installer\KyZer-YouBe-Setup.exe"
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $setupExe
            if ($LASTEXITCODE -ne 0) { throw "Signing the Setup executable failed." }
            & $signTool.FullName verify /pa /v $setupExe
            if ($LASTEXITCODE -ne 0) { throw "Setup signature verification failed." }
            "Trusted Authenticode signature applied and verified."
          } else {
            Write-Warning "No trusted signing certificate secrets found. Setup.exe is unsigned; SmartScreen may show an unrecognized-app warning."
          }

      - name: Upload installer-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: KyZer-YouBe-Setup
          path: installer/KyZer-YouBe-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: KyZer YouBe v2.0.2 (Smaller Installer)
          make_latest: true
          prerelease: false
          overwrite_files: true
          files: installer/KyZer-YouBe-Setup.exe
          body: |
            KyZer YouBe v2.0.2 — Other DL, Download Later and rate-limit improvements.

            Includes YouTube, TikTok, Facebook and additional yt-dlp-supported websites; local WhatsApp Desktop detection; separate video/audio options; Download Later; media info; preview; clip selection; progress details and logs.

            Only the Setup.exe installer is published; the oversized duplicate portable package is not included.
            If no trusted code-signing certificate is configured, Windows SmartScreen may show an unrecognized-app warning.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
