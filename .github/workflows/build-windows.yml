name: Build KyZer YouBe Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Validate Python source
        run: |
          python -m compileall -q app.py downloader.py build_windows.py
          python -m unittest discover -s tests -v

      - name: Build Windows application folder
        run: python build_windows.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $compiler = "PROGRAMFILES_X86\Inno Setup 6\ISCC.exe"
          $compiler = $compiler.Replace("PROGRAMFILES_X86", $env:ProgramFiles(x86))
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found: $compiler" }
          & $compiler "Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Sign app and installer if a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $certPath = Join-Path $env:RUNNER_TEMP "kyzer-codesign.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $kits = Join-Path $env:ProgramFiles "Windows Kits\10\bin"
            $signTool = Get-ChildItem $kits -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw "Windows SDK signtool.exe was not found." }
            $appExe = Join-Path $PWD "dist\KyZer YouBe\KyZer YouBe.exe"
            $setupExe = Join-Path $PWD "installer\KyZer-YouBe-Setup.exe"
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $appExe
            if ($LASTEXITCODE -ne 0) { throw "Signing the app executable failed." }
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $setupExe
            if ($LASTEXITCODE -ne 0) { throw "Signing the Setup executable failed." }
            & $signTool.FullName verify /pa /v $setupExe
            if ($LASTEXITCODE -ne 0) { throw "Setup signature verification failed." }
            "Trusted Authenticode signature applied."
          } else {
            Write-Warning "No trusted signing certificate secrets found. This build is unsigned; SmartScreen may display an unrecognized-app warning."
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\KyZer YouBe\*" -DestinationPath "KyZer-YouBe-Portable-Windows.zip" -Force
          if (-not (Test-Path "installer\KyZer-YouBe-Setup.exe")) { throw "Setup.exe was not created." }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KyZer-YouBe-Windows
          path: |
            installer/KyZer-YouBe-Setup.exe
            KyZer-YouBe-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: KyZer YouBe v2.0.0
          make_latest: true
          prerelease: false
          overwrite_files: true
          files: |
            installer/KyZer-YouBe-Setup.exe
            KyZer-YouBe-Portable-Windows.zip
          body: |
            KyZer YouBe all-in-one Windows desktop release.

            Includes YouTube, TikTok and Facebook download support; local WhatsApp Status Saver; media info; preview; clip selection; detailed download progress; history and settings.

            Install with KyZer-YouBe-Setup.exe. A portable ZIP is also available.
            If no trusted code-signing certificate is configured, Windows SmartScreen may show an unrecognized-app warning.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
